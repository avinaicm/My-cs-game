<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web CS 1.6</title>
    <style>
        body { margin: 0; background-color: black; color: white; text-align: center; font-family: sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <!-- Loading Xash3D WebAssembly Engine Engine from Public CDN -->
    <script src="https://jsdelivr.net"></script>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike'],
            print: console.log,
            printErr: console.error,
            // Yeh engine hamari uploaded ZIP file se assets read karega
            memoryInitializerPrefixURL: '',
            preloadPlugins: []
        };
        
        // Fetching your custom cstrike.zip from this repository
        fetch('cstrike.zip')
            .then(response => response.arrayBuffer())
            .then(data => {
                Module.FS_createDataFile("/", "cstrike.zip", new Uint8Array(data), true, true, true);
                console.log("Assets loaded successfully! Launching engine...");
            });
    </script>
</body>
</html>
